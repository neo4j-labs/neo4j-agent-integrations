name: neo4j-research-agent-framework
description: >
  Microsoft Agent Framework + Neo4j multi-agent investment research agent
  (coordinator, database agent, analyst), hosted on Foundry Agent Service.
metadata:
  tags:
    - Agent Framework
    - Neo4j
    - Multi-agent
    - Investment Research
    - Responses Protocol
template:
  name: neo4j-research-agent-framework
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: EMBEDDING_DEPLOYMENT_NAME
      value: ${EMBEDDING_DEPLOYMENT_NAME}
    - name: NEO4J_URI
      value: ${NEO4J_URI}
    - name: NEO4J_DATABASE
      value: ${NEO4J_DATABASE}
    - name: NEO4J_USERNAME
      value: ${NEO4J_USERNAME}
    - name: NEO4J_PASSWORD
      value: ${NEO4J_PASSWORD}
resources:
  - kind: model
    id: gpt-5-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
