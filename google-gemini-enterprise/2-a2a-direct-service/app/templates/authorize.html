<!DOCTYPE html>
<html>
<head>
    <title>Login to Neo4j Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #202124; margin-top: 0; margin-bottom: 10px; }
        p { color: #5f6368; line-height: 1.5; margin-bottom: 25px; font-size: 14px; }
        label { display: block; text-align: left; font-weight: 500; color: #5f6368; font-size: 14px; margin-bottom: 5px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background-color 0.2s; }
        .btn:hover { background-color: #1557b0; }
        .error-msg { color: #d93025; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login to Neo4j Agent</h2>
        <p>Enter your Agent credentials to connect Gemini Enterprise to your database.</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/auth/login" method="POST">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="state" value="{{ state }}">
            <input type="hidden" name="client_id" value="{{ client_id }}">

            <label>Work Email</label>
            <input type="email" name="email" placeholder="user@yourcompany.com" required>

            <label>Agent Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn">Log In & Connect</button>
        </form>
    </div>
</body>
</html>
