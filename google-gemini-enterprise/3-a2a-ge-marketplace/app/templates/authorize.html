<!DOCTYPE html>
<html>
<head>
    <title>Authorize Neo4j Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }

        p { color: #5f6368; line-height: 1.5; margin-bottom: 30px; }

        .btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Connect Neo4j Agent</h2>
        <p>Gemini Enterprise is requesting permission to access your Neo4j Graph Database agent.</p>
        <a href="{{ final_redirect }}" class="btn">Allow Access</a>
    </div>

</html>
