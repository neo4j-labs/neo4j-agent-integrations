[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-agent-integration-custom-tools"
version = "0.1.0"
description = "Reusable Neo4j custom tools for agent integrations"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "neo4j>=5.18.0",
]

[tool.setuptools]
packages = ["custom_tools"]
package-dir = { custom_tools = "." }
