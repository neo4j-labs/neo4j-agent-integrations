<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neo4j Graph Intelligence Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f4f7fb;
        color: #152033;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #fff;
        border: 1px solid #d8e0eb;
        border-radius: 16px;
        box-shadow: 0 16px 45px rgba(29, 54, 89, .12);
        display: flex;
        flex-direction: column;
        height: min(740px, 92vh);
        max-width: 820px;
        overflow: hidden;
        width: min(94vw, 820px);
      }

      header {
        background: #0b5cad;
        color: #fff;
        padding: 24px 28px;
      }

      h1 { font-size: 1.35rem; margin: 0; }
      header p { margin: 6px 0 0; opacity: .9; }

      #messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding: 24px 28px;
      }

      .message {
        border-radius: 12px;
        line-height: 1.5;
        max-width: 85%;
        padding: 12px 16px;
        white-space: pre-wrap;
      }

      .assistant { background: #edf4fc; align-self: flex-start; }
      .user { background: #0b5cad; color: #fff; align-self: flex-end; }
      .error { background: #fff0f0; color: #9e2020; }

      form {
        border-top: 1px solid #d8e0eb;
        display: flex;
        gap: 12px;
        padding: 18px 28px;
      }

      textarea {
        border: 1px solid #9cacbf;
        border-radius: 8px;
        flex: 1;
        font: inherit;
        min-height: 48px;
        padding: 10px;
        resize: vertical;
      }

      button {
        background: #0b5cad;
        border: 0;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0 20px;
      }

      button:disabled { cursor: wait; opacity: .65; }
      .hint { color: #59677a; font-size: .85rem; margin: 0 28px 16px; }
      .sr-only {
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        width: 1px;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <header>
        <h1 id="title">Neo4j Graph Intelligence Assistant</h1>
        <p>Ask questions about the connected data in your Neo4j graph.</p>
      </header>
      <section id="messages" aria-live="polite" aria-label="Conversation">
        <div class="message assistant">How can I help you explore your Neo4j graph?</div>
      </section>
      <form id="query-form">
        <label for="query" class="sr-only">Your question</label>
        <textarea id="query" name="query" placeholder="e.g. Which organizations are connected to Google?" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Responses are generated from the configured Neo4j and optional local MCP tools.</p>
    </main>
    <script>
      const form = document.querySelector("#query-form");
      const input = document.querySelector("#query");
      const messages = document.querySelector("#messages");
      const send = document.querySelector("#send");

      function addMessage(content, type) {
        const message = document.createElement("div");
        message.className = `message ${type}`;
        message.textContent = content;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
        return message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        addMessage(query, "user");
        input.value = "";
        input.disabled = true;
        send.disabled = true;
        const pending = addMessage("Thinking...", "assistant");

        try {
          const response = await fetch("/api/v1/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
          });
          const payload = await response.json();
          pending.remove();
          if (!response.ok) {
            addMessage(payload.detail || "The request could not be completed.", "assistant error");
            return;
          }
          addMessage(payload.result, "assistant");
        } catch (error) {
          pending.remove();
          addMessage("Unable to reach the agent service. Please try again.", "assistant error");
        } finally {
          input.disabled = false;
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
