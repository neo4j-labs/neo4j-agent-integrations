spec_version: v1
kind: agent
name: memory_agent
title: Neo4j Memory and Graph Agent
description: >
  Assistant that combines long-term memory (Neo4j Agent Memory Service) with a
  Neo4j companies knowledge graph. Remembers facts about people across sessions
  and answers questions about companies, people, and investments.
deployment:
  code_bundle:
    entrypoint: agent:create_agent
