# Hand-written records for the hero scenarios in PRD section 4.
#
# generate-data merges these into the background population. Background
# records never use hero IDs (customers C-1xxx, accounts A-1xxx and A-2xxx,
# counterparties CP-1xxx, transactions T-1xxx, alerts AL-1xxx, payments
# SP-1xxx) and never add transactions, alerts or scheduled payments to a hero
# account, so the scenario answers cannot drift.
#
# Balances reconcile by construction, and validate-data checks them:
#   ledger_balance    = opening_balance + POSTED credits - POSTED debits
#   available_balance = ledger_balance - HELD or PENDING debits
# opening_balance is the balance at the start of the 90-day window
# (2026-07-10). It is used only for that check and is not loaded into Neo4j.
# Credits are WIRE_IN, ACH_IN, CHECK_DEPOSIT. Debits are WIRE_OUT, ACH_OUT,
# CARD, FEE, TRANSFER. Amounts are always positive.
#
# Datetimes are UTC. US Eastern is UTC-4 in this period, so 15:42Z is
# 11:42 AM ET.

