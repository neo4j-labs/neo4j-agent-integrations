# Canonical bank rules. The single source of truth for every amount, hold
# period and threshold in the demo.
#
# Read by:
#   render-policies     fills the ${placeholders} in data/policy_templates/
#   generate-data       charges fees and sets holds that match these rules
#   validate-data       checks the CSVs and rendered documents against them
#   load-structured     loads the rule layer (PRD section 5.2)
#
# Schema
#   products[]          -> (:AccountProduct)
#     product_code        key, e.g. CHK-PREM
#     name, tier          tier is STANDARD or PREMIUM
#     monthly_fee         decimal dollars
#
#   policies[]          -> (:Policy) and one (:Document) each
#     policy_id           key, e.g. POL-FEES
#     name                also the document title (the "# <Title>" line)
#     effective_date      YYYY-MM-DD
#     file                file name in data/policy_templates/ and data/policies/
#
#   fee_rules[]         -> (:FeeRule)
#   hold_rules[]        -> (:HoldRule)
#   compliance_rules[]  -> (:ComplianceRule)
#     rule_code           key; tagged as "Rule code: <CODE>" in exactly one
#                         section of the document for policy_id
#     policy_id           (:Policy)-[:DEFINES]->(rule)
#     name, condition     condition is a plain-English summary
#     transaction_types   list of Transaction.type values the rule covers
#     amount              fee rules: decimal dollars
#     hold_days           hold rules: business days
#     threshold           decimal dollars, or null. Optional on fee and hold
#                         rules (FEE-OVERDRAFT, HOLD-CHECK-LARGE).
#     applies_to          fee rules: product codes  -> [:APPLIES_TO]
#     waived_for          fee rules: product codes  -> [:WAIVED_FOR]
#                         always a subset of applies_to
#
# Template placeholders are derived from these values by render-policies:
#   ${<code>_<field>}  with the code lower-cased and "-" replaced by "_".
#   Examples: ${fee_wire_return_amount} -> $35, ${chk_prem_name} -> Premium
#   Checking, ${pol_fees_effective_date} -> January 1, 2026.

products:
  - product_code: CHK-STD
    name: Standard Checking
    tier: STANDARD
    monthly_fee: 12.00
  - product_code: CHK-PREM
    name: Premium Checking
    tier: PREMIUM
    monthly_fee: 25.00
  - product_code: SAV-STD
    name: Standard Savings
    tier: STANDARD
    monthly_fee: 5.00

policies:
  - policy_id: POL-PRODUCTS
    name: Account Products and Tiers
    effective_date: 2026-01-01
    file: account_products.md
  - policy_id: POL-FEES
    name: Fee Schedule
    effective_date: 2026-01-01
    file: fee_schedule.md
  - policy_id: POL-FUNDS
    name: Funds Availability and Check Holds
    effective_date: 2026-01-01
    file: funds_availability.md
  - policy_id: POL-WIRE
    name: Wire Transfer Policy
    effective_date: 2026-01-01
    file: wire_transfers.md
  - policy_id: POL-SCREEN
    name: Payment Screening and Compliance Review
    effective_date: 2026-01-01
    file: payment_screening.md
  - policy_id: POL-OD
    name: Overdraft Policy
    effective_date: 2026-01-01
    file: overdraft.md
  - policy_id: POL-JOINT
    name: Joint Accounts and Authorized Users
    effective_date: 2026-01-01
    file: joint_accounts.md
  - policy_id: POL-COMPLAINTS
    name: Complaint Handling
    effective_date: 2026-01-01
    file: complaint_handling.md

fee_rules:
  - rule_code: FEE-WIRE-OUT
    policy_id: POL-FEES
    name: Outgoing wire fee
    condition: Charged for each outgoing domestic wire. Waived for Premium Checking.
    transaction_types: [WIRE_OUT]
    amount: 30.00
    applies_to: [CHK-STD, CHK-PREM]
    waived_for: [CHK-PREM]
  - rule_code: FEE-WIRE-IN
    policy_id: POL-FEES
    name: Incoming wire fee
    condition: Charged for each incoming wire. Waived for Premium Checking.
    transaction_types: [WIRE_IN]
    amount: 15.00
    applies_to: [CHK-STD, CHK-PREM, SAV-STD]
    waived_for: [CHK-PREM]
  - rule_code: FEE-WIRE-RETURN
    policy_id: POL-FEES
    name: Returned wire fee
    condition: >-
      Charged when an outgoing wire is returned by the receiving bank. Not
      charged for wires that are held for review. Waived for Premium Checking.
    transaction_types: [WIRE_OUT]
    amount: 35.00
    applies_to: [CHK-STD, CHK-PREM]
    waived_for: [CHK-PREM]
  - rule_code: FEE-DEPOSIT-RETURN
    policy_id: POL-FEES
    name: Returned deposited item fee
    condition: Charged when a deposited check is returned unpaid.
    transaction_types: [CHECK_DEPOSIT]
    amount: 12.00
    applies_to: [CHK-STD, CHK-PREM, SAV-STD]
    waived_for: []
  - rule_code: FEE-OVERDRAFT
    policy_id: POL-OD
    name: Overdraft fee
    condition: >-
      Charged per item paid that overdraws the account. No fee when the account
      is overdrawn by the threshold or less. Waived for Premium Checking.
    transaction_types: [ACH_OUT, CARD]
    amount: 29.00
    threshold: 50.00
    applies_to: [CHK-STD, CHK-PREM]
    waived_for: [CHK-PREM]
  - rule_code: FEE-ODP-TRANSFER
    policy_id: POL-OD
    name: Overdraft Protection transfer fee
    condition: >-
      Charged for each automatic transfer from a linked savings account that
      covers an overdraft. Waived for Premium Checking.
    transaction_types: [TRANSFER]
    amount: 10.00
    applies_to: [CHK-STD, CHK-PREM]
    waived_for: [CHK-PREM]

hold_rules:
  - rule_code: HOLD-CHECK-NBD
    policy_id: POL-FUNDS
    name: Next business day check availability
    condition: >-
      Checks deposited on a business day before the 8:00 PM ET cutoff are
      available on the next business day.
    transaction_types: [CHECK_DEPOSIT]
    hold_days: 1
  - rule_code: HOLD-CHECK-LARGE
    policy_id: POL-FUNDS
    name: Large deposit hold
    condition: >-
      The part of a day's check deposits above the threshold can be held for
      up to the hold period.
    transaction_types: [CHECK_DEPOSIT]
    hold_days: 5
    threshold: 5525.00

compliance_rules:
  - rule_code: WIRE-REVIEW-01
    policy_id: POL-SCREEN
    name: New payee wire review
    condition: >-
      The first outgoing wire to a payee above the threshold is held for a
      standard review. Reviews usually finish within one business day. A held
      wire has not failed and is not charged a returned-wire fee.
    transaction_types: [WIRE_OUT]
    threshold: 3000.00
  - rule_code: SANCTIONS-SCREEN-01
    policy_id: POL-SCREEN
    name: Sanctions screening
    condition: >-
      A payment whose payee or sender is a potential match to a sanctions list
      is held until the match is cleared.
    transaction_types: [WIRE_OUT, WIRE_IN, ACH_OUT]
    threshold: null
  - rule_code: AML-VELOCITY-01
    policy_id: POL-SCREEN
    name: High-value outgoing activity review
    condition: >-
      Outgoing payments from one account totaling more than the threshold
      within 24 hours are reviewed.
    transaction_types: [WIRE_OUT, ACH_OUT, TRANSFER]
    threshold: 10000.00
