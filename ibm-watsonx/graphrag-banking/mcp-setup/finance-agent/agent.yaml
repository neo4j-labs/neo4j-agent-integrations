spec_version: v1
kind: agent
name: finance_graph_agent
title: Finance Graph MCP Agent
description: >
  Answers questions about the Neo4j finance graph (customers, accounts,
  transactions, and bank policies). It calls the neo4j-mcp-finance MCP server
  through the AgentCore gateway to read the schema and run read-only Cypher.
deployment:
  code_bundle:
    entrypoint: agent:create_agent
