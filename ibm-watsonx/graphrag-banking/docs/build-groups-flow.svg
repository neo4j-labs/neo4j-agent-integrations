<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How build-groups finds connected groups in Aura</title>
  <desc id="d">Five steps run in an Aura Graph Analytics session before any agent asks a question. Graph Data Science projects people, customers and businesses with the identifiers they share, drops normal links, finds weakly connected components, scores betweenness centrality and writes ConnectedGroup nodes back to the graph. Before the run, four businesses are linked by one shared phone and a shared device. After it, one ConnectedGroup node holds the members and Victor Hale has the highest score.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="536" fill="#ffffff"/>

  <text x="20" y="32" font-size="18" font-weight="700" fill="#0f172a">build-groups: how Aura finds the connected groups</text>
  <text x="20" y="50" font-size="12" fill="#475569">Graph Data Science runs in an Aura Graph Analytics session, before any agent asks a question</text>

  <!-- Steps -->
  <g>
    <rect x="20" y="68" width="172" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="38" cy="88" r="9" fill="#1f9d6b"/>
    <text x="38" y="92" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="54" y="92" font-size="12.5" font-weight="700" fill="#0f172a">Project</text>
    <text x="32" y="114" font-size="11" fill="#334155">People, customers and</text>
    <text x="32" y="128" font-size="11" fill="#334155">businesses, plus the phones,</text>
    <text x="32" y="142" font-size="11" fill="#334155">emails, devices and</text>
    <text x="32" y="156" font-size="11" fill="#334155">addresses they share</text>
  </g>
  <g>
    <rect x="207" y="68" width="172" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="225" cy="88" r="9" fill="#1f9d6b"/>
    <text x="225" y="92" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="241" y="92" font-size="12.5" font-weight="700" fill="#0f172a">Filter</text>
    <text x="219" y="114" font-size="11" fill="#334155">Drop identifiers one party</text>
    <text x="219" y="128" font-size="11" fill="#334155">uses, registered agent and</text>
    <text x="219" y="142" font-size="11" fill="#334155">coworking addresses, and</text>
    <text x="219" y="156" font-size="11" fill="#334155">ownership-only clusters</text>
  </g>
  <g>
    <rect x="394" y="68" width="172" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="412" cy="88" r="9" fill="#1f9d6b"/>
    <text x="412" y="92" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="428" y="92" font-size="12.5" font-weight="700" fill="#0f172a">Find groups</text>
    <text x="406" y="114" font-size="11" fill="#334155">Weakly connected components</text>
    <text x="406" y="128" font-size="11" fill="#334155">join parties linked by a</text>
    <text x="406" y="142" font-size="11" fill="#334155">chain of shared</text>
    <text x="406" y="156" font-size="11" fill="#334155">identifiers. 17 groups.</text>
  </g>
  <g>
    <rect x="581" y="68" width="172" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <circle cx="599" cy="88" r="9" fill="#1f9d6b"/>
    <text x="599" y="92" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="615" y="92" font-size="12.5" font-weight="700" fill="#0f172a">Score</text>
    <text x="593" y="114" font-size="11" fill="#334155">Betweenness centrality</text>
    <text x="593" y="128" font-size="11" fill="#334155">rates how often a member</text>
    <text x="593" y="142" font-size="11" fill="#334155">sits between the others.</text>
    <text x="593" y="156" font-size="11" fill="#334155">Hale scores 25.6.</text>
  </g>
  <g>
    <rect x="768" y="68" width="172" height="100" rx="8" fill="#e9f7f0" stroke="#1f9d6b"/>
    <circle cx="786" cy="88" r="9" fill="#1f9d6b"/>
    <text x="786" y="92" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="802" y="92" font-size="12.5" font-weight="700" fill="#0f172a">Write back</text>
    <text x="780" y="114" font-size="11" fill="#334155">ConnectedGroup nodes and</text>
    <text x="780" y="128" font-size="11" fill="#334155">IN_GROUP links, with the</text>
    <text x="780" y="142" font-size="11" fill="#334155">score on each link, go</text>
    <text x="780" y="156" font-size="11" fill="#334155">into the Aura graph.</text>
  </g>
  <line x1="193" y1="118" x2="206" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="118" x2="393" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="567" y1="118" x2="580" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="754" y1="118" x2="767" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Illustration -->
  <text x="20" y="206" font-size="14" font-weight="700" fill="#0f172a">What it does to the demo graph</text>

  <!-- Before panel -->
  <rect x="20" y="220" width="440" height="276" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="34" y="242" font-size="12.5" font-weight="700" fill="#0f172a">Before: parties linked by shared identifiers</text>

  <g stroke="#94a3b8" stroke-width="1.3">
    <line x1="170" y1="290" x2="300" y2="277"/>
    <line x1="170" y1="290" x2="300" y2="319"/>
    <line x1="170" y1="290" x2="300" y2="361"/>
    <line x1="170" y1="290" x2="300" y2="403"/>
    <line x1="170" y1="368" x2="300" y2="277"/>
    <line x1="170" y1="368" x2="300" y2="319"/>
    <line x1="170" y1="368" x2="300" y2="361"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <rect x="50" y="273" width="120" height="34" rx="6" fill="#ffffff" stroke="#4a6fd8"/>
    <text x="110" y="288" font-weight="700" fill="#0f172a">Phone</text>
    <text x="110" y="301" font-size="10" fill="#334155">+1-555-0610</text>
    <rect x="50" y="351" width="120" height="34" rx="6" fill="#ffffff" stroke="#4a6fd8"/>
    <text x="110" y="366" font-weight="700" fill="#0f172a">Device</text>
    <text x="110" y="379" font-size="10" fill="#334155">DEV-1001</text>

    <rect x="300" y="262" width="140" height="30" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="370" y="281" fill="#0f172a">Ortega Builders</text>
    <rect x="300" y="304" width="140" height="30" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="370" y="323" fill="#0f172a">Keystone Paving</text>
    <rect x="300" y="346" width="140" height="30" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="370" y="365" fill="#0f172a">Summit Ridge Supply</text>
    <rect x="300" y="388" width="140" height="30" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="370" y="407" fill="#0f172a">Lakeview Interiors</text>
  </g>
  <text x="34" y="446" font-size="11" fill="#334155">The phone links all four businesses. The device links three.</text>
  <text x="34" y="462" font-size="11" fill="#334155">A registered agent address is left out, because many unrelated</text>
  <text x="34" y="476" font-size="11" fill="#334155">parties share one and it is not a red flag on its own.</text>

  <line x1="462" y1="358" x2="498" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- After panel -->
  <rect x="500" y="220" width="440" height="276" rx="8" fill="#e9f7f0" stroke="#1f9d6b"/>
  <text x="514" y="242" font-size="12.5" font-weight="700" fill="#0f172a">After: one group with a score on every link</text>

  <g stroke="#1f9d6b" stroke-width="1.5">
    <line x1="660" y1="358" x2="730" y2="276" stroke-width="3.5"/>
    <line x1="660" y1="358" x2="730" y2="310"/>
    <line x1="660" y1="358" x2="730" y2="344"/>
    <line x1="660" y1="358" x2="730" y2="378"/>
    <line x1="660" y1="358" x2="730" y2="412"/>
    <line x1="660" y1="358" x2="730" y2="446"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <rect x="530" y="334" width="130" height="48" rx="8" fill="#1f9d6b"/>
    <text x="595" y="354" font-weight="700" fill="#ffffff">ConnectedGroup</text>
    <text x="595" y="370" font-size="10" fill="#ffffff">CG-0001, 11 members</text>

    <rect x="730" y="262" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b" stroke-width="2"/>
    <text x="825" y="280" font-weight="700" fill="#0f172a">Victor Hale, score 25.6</text>
    <rect x="730" y="296" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="825" y="314" fill="#0f172a">Ortega Builders</text>
    <rect x="730" y="330" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="825" y="348" fill="#0f172a">Keystone Paving</text>
    <rect x="730" y="364" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="825" y="382" fill="#0f172a">Summit Ridge Supply</text>
    <rect x="730" y="398" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b"/>
    <text x="825" y="416" fill="#0f172a">Lakeview Interiors</text>
    <rect x="730" y="432" width="190" height="28" rx="6" fill="#ffffff" stroke="#1f9d6b" stroke-dasharray="4 3"/>
    <text x="825" y="450" fill="#334155">and 6 more members</text>
  </g>
  <text x="595" y="404" font-size="10" fill="#136b49" text-anchor="middle">IN_GROUP links</text>
  <text x="514" y="476" font-size="11" fill="#334155">The thick link marks the highest score. Hale is not on Ortega's</text>
  <text x="514" y="490" font-size="11" fill="#334155">application, and he sits at the center of its group.</text>

  <text x="20" y="522" font-size="11.5" fill="#334155">The groups are stored in the graph, so get_connected_group reads one with a single query and no agent has to find the ring.</text>
</svg>
