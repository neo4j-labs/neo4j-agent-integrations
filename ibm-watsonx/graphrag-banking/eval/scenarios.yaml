      - "65,000"            # GEN accounts.csv: A-3002 ledger and available balance
      - "18,500"            # HF T-30201
      - "17,200"            # HF T-30202
      - "16,800"            # HF T-30204
      - "19,100"            # HF T-30203
      - "18,400"            # HF T-30205
      - "14,600"            # HF T-30206
      - "15,200"            # HF T-30207
      - "15,400"            # HF T-30208
      - "14,800"            # HF T-30209
      - "$1,450,000"        # HF APP-1002 stated revenue
