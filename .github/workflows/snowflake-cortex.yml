name: Snowflake Cortex

on:
  push:
    branches: [main]
    paths:
      - 'snowflake-cortex/**'
      - '.github/workflows/snowflake-cortex.yml'
  pull_request:
    paths:
      - 'snowflake-cortex/**'
      - '.github/workflows/snowflake-cortex.yml'

permissions:
  contents: read

jobs:
  # Everything checkable without Snowflake credentials.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform
        working-directory: snowflake-cortex/samples/1-terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
