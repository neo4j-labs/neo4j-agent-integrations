name: Screencasts

on:
  push:
    branches: [screencasts]
  pull_request:
    branches: [screencasts]

permissions:
  contents: read

jobs:
  # Recording needs live accounts and stays manual.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Guide code blocks match their source
        run: npm run readme:check --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
