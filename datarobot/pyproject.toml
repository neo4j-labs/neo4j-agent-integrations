[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-datarobot-nat-plugin"
version = "0.1.0"
description = "NeMo Agent Toolkit (NAT) plugin: Neo4j company-graph tools + NAMS memory, for use in a dragent workflow.yaml"
requires-python = ">=3.10"
dependencies = [
    "nvidia-nat",
]

[project.optional-dependencies]
# Installed separately per deployment target; see requirements.txt for the
# full local-dev dependency set (langchain-neo4j, neo4j-agent-memory, etc.).
dragent = ["datarobot-genai[langgraph,dragent]"]

# Entry points NAT discovers via importlib.metadata at startup. Importing
# each module runs its `@register_function` / `@register_memory` decorators
# as a side effect, exactly like DataRobot's own datarobot-genai[dragent]
# plugins (streaming_memory_agent, dr_mem0_memory, etc.) register themselves.
[project.entry-points.'nat.plugins']
neo4j_tools = "agent.nat_tools"
neo4j_agent_memory = "agent.nat_memory"

[tool.setuptools.packages.find]
include = ["agent*"]
