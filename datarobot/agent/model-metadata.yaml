---
name: neo4j_datarobot_agent
type: inference
targetType: agenticworkflow
runtimeParameterDefinitions:
  - fieldName: OPENAI_API_KEY
    defaultValue: SET_VIA_PULUMI_OR_MANUALLY
    type: credential
  - fieldName: OPENAI_MODEL
    defaultValue: gpt-4o-mini
    type: string
  - fieldName: OPENAI_EMBEDDING_MODEL
    defaultValue: text-embedding-3-small
    type: string
  - fieldName: NEO4J_URI
    defaultValue: neo4j+s://demo.neo4jlabs.com:7687
    type: string
  - fieldName: NEO4J_USERNAME
    defaultValue: companies
    type: string
  - fieldName: NEO4J_PASSWORD
    defaultValue: SET_VIA_PULUMI_OR_MANUALLY
    type: credential
  - fieldName: NEO4J_DATABASE
    defaultValue: companies
    type: string
  - fieldName: AGENT_MAX_TOOL_STEPS
    defaultValue: "6"
    type: string
  - fieldName: MEMORY_API_KEY
    defaultValue: ""
    type: credential
